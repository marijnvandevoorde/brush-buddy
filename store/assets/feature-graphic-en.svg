<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FAE"/>
      <stop offset="1" stop-color="#B79CED"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6B3A56" flood-opacity="0.28"/>
    </filter>
    <filter id="text" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6B3A56" flood-opacity="0.35"/>
    </filter>
    <filter id="buddy" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6B3A56" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- sparkles, kept clear of the centre where Play may overlay UI -->
  <g fill="#ffffff" opacity="0.7">
    <path d="M78 96 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M960 380 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z"/>
    <circle cx="150" cy="418" r="7"/>
    <circle cx="600" cy="72" r="9"/>
    <circle cx="60" cy="272" r="5"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#text)">
    <text x="72" y="200" font-family="Verdana,DejaVu Sans,sans-serif" font-size="62" font-weight="bold" fill="#ffffff">Brush Buddy</text>
    <text x="75" y="256" font-family="Verdana,DejaVu Sans,sans-serif" font-size="26" fill="#FFF0F7">Two minutes, brushed properly</text>
  </g>

  <!-- pills: the app's actual selling points -->
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="19" font-weight="bold">
    <g filter="url(#card)">
      <rect x="72" y="320" width="112" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
      <rect x="202" y="320" width="176" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
      <rect x="396" y="320" width="150" height="50" rx="25" fill="#ffffff" opacity="0.95"/>
    </g>
    <text x="128" y="352" text-anchor="middle" fill="#6B3A56">No ads</text>
    <text x="290" y="352" text-anchor="middle" fill="#6B3A56">Works offline</text>
    <text x="471" y="352" text-anchor="middle" fill="#6B3A56">Ages 3-8</text>
  </g>

  <!-- the buddy: the same tooth + face as the app and the launcher icon -->
  <g filter="url(#buddy)" transform="translate(700,72) scale(2.9)">
    <path d="M50 15 C47 7 37 6 31 9 C18 14 9 28 11 46 C12 58 14 64 16 73 C19 90 20 111 30 109 C39 107 44 83 50 83 C56 83 61 107 70 109 C80 111 81 90 84 73 C86 64 88 58 89 46 C91 28 82 14 69 9 C63 6 53 7 50 15 Z" fill="#F6F6F3"/>
    <path d="M32 27 Q50 33 68 27" fill="none" stroke="#E2E2DC" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M31 19 C24 23 20 32 24 39 C32 33 36 26 36 22 C35 19 33 18 31 19 Z" fill="#ffffff" opacity="0.92"/>
    <circle cx="40" cy="20" r="3" fill="#ffffff" opacity="0.92"/>
    <ellipse cx="22" cy="58" rx="7" ry="4.8" fill="#F6A6A6" opacity="0.85"/>
    <ellipse cx="78" cy="58" rx="7" ry="4.8" fill="#F6A6A6" opacity="0.85"/>
    <ellipse cx="34" cy="42" rx="7" ry="9.5" fill="#2A2A2A"/>
    <ellipse cx="66" cy="42" rx="7" ry="9.5" fill="#2A2A2A"/>
    <circle cx="31.5" cy="38" r="2.6" fill="#ffffff"/>
    <circle cx="63.5" cy="38" r="2.6" fill="#ffffff"/>
    <path d="M34 58 Q50 76 66 58" fill="none" stroke="#2A2A2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
